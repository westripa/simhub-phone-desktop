[package]
name = "simhub-phone"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.1"

[profile.release]
strip = true
codegen-units = 1
lto = "thin"
